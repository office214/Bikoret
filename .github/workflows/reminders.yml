# בדיקה כל כמה דקות אם הגיע זמן לשלוח תזכורת על ביקורת שראש הישיבה ביקש (שעה לפני).
# הקריאה לא מכילה מידע ולא משנה דבר מלבד שליחת תזכורות שהגיע זמנן (כל אחת פעם אחת).
name: reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 https://bikoret-gray.vercel.app/api/cron/reminders || true
